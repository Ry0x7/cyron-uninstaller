[package]
name = "cyron"
version = "0.2.5"
description = "Windows Application Uninstaller, Disk Analyzer & Cleaner"
authors = ["Chryypt"]
license-file = "../LICENSE"
edition = "2021"
rust-version = "1.77"

[package.metadata.tauri-winres]
OriginalFilename = "cyron.exe"
InternalName = "cyron.exe"
FileDescription = "Windows Application Uninstaller, Disk Analyzer & Cleaner"
ProductName = "Cyron Uninstaller"
CompanyName = "Chryypt"
LegalCopyright = "Copyright © 2026 Chryypt"

[lib]
name = "cyron_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
regex = "1"
winreg = "0.56"
windows = { version = "0.62", features = [
  "ApplicationModel",
  "Foundation",
  "Foundation_Collections",
  "Management_Deployment",
] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_EventLog",
  "Win32_System_Ioctl",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_Performance",
  "Win32_System_ProcessStatus",
  "Win32_System_RestartManager",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_System_Time",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = "debuginfo"
