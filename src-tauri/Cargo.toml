[package]
name = "cyron"
version = "0.1.0"
description = "Windows Application Uninstaller, Disk Analyzer & Cleaner"
authors = ["Ry0x7"]
edition = "2021"
rust-version = "1.77"

[package.metadata.tauri-winres]
OriginalFilename = "cyron.exe"
InternalName = "cyron.exe"
FileDescription = "Windows Application Uninstaller, Disk Analyzer & Cleaner"
ProductName = "Cyron Uninstaller"
CompanyName = "Ry0x7"
LegalCopyright = "Copyright © 2026 Ry0x7"

[lib]
name = "cyron_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
winreg = "0.55"
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Ioctl",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
