name: SignPath Release Signing (SIGNPATH_SIGNED)

# This workflow builds release binaries, validates security gates, submits artifacts to
# the SignPath Foundation for Authenticode signing, verifies the returned signatures,
# and prepares a draft release.
#
# STATUS: DISABLED BY DEFAULT
# Requires an approved SignPath Foundation project and organization configuration.
# Do not run until project eligibility is approved and secrets are configured.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag to build and sign (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'
      enable_signpath_submission:
        description: 'Set to "true" only when SignPath Foundation credentials are ready'
        required: true
        default: 'false'

permissions:
  contents: write

jobs:
  verify-and-build:
    name: Build & Verify Release Artifacts
    runs-on: windows-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Tests & Typecheck
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run Full Rust Test Suites & Security Gates
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml --test security -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml --test cleanup_stress -- --nocapture
          node scripts/verify-cleanup.mjs
          node scripts/verify-e2e.mjs

      - name: Build Unsigned Windows Release Bundles
        run: npm run build:unsigned

      - name: Verify Windows Metadata
        run: npm run verify:metadata

      - name: Record Unsigned Hashes & Build Provenance
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "unsigned-artifacts"
          Copy-Item "src-tauri\target\release\cyron.exe" "unsigned-artifacts\"
          Copy-Item "src-tauri\target\release\bundle\nsis\*.exe" "unsigned-artifacts\"
          Copy-Item "src-tauri\target\release\bundle\msi\*.msi" "unsigned-artifacts\"

          Get-FileHash unsigned-artifacts\* -Algorithm SHA256 | Tee-Object "unsigned-artifacts\SHA256SUMS-unsigned.txt"
          
          $provenance = @{
              Commit = $env:GITHUB_SHA
              Tag = "${{ github.event.inputs.release_tag }}"
              BuildDate = (Get-Date -Format o)
              Builder = "GitHub Actions"
              Runner = $env:RUNNER_OS
          }
          $provenance | ConvertTo-Json | Set-Content "unsigned-artifacts\build-provenance.json"

      - name: Upload Unsigned Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-release-artifacts
          path: unsigned-artifacts/

  sign-with-signpath:
    name: Sign with SignPath Foundation
    needs: verify-and-build
    runs-on: windows-latest
    if: ${{ github.event.inputs.enable_signpath_submission == 'true' }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag }}

      - name: Download Unsigned Artifacts
        uses: actions/download-artifact@v4
        with:
          name: unsigned-release-artifacts
          path: unsigned-artifacts

      - name: Submit Signing Request to SignPath
        # Official SignPath GitHub Action (requires SIGNPATH_API_TOKEN secret and SignPath project config)
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: 'cyron-uninstaller'
          signing-policy-slug: 'release-signing'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          output-artifact-directory: 'signed-artifacts'
          parameters: |
            files:
              - unsigned-artifacts/cyron.exe
              - unsigned-artifacts/Cyron Uninstaller_*.exe
              - unsigned-artifacts/Cyron Uninstaller_*.msi

      - name: Verify SignPath Authenticode Signatures
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "signed-artifacts" -Include *.exe,*.msi -Recurse
          $failures = @()
          foreach ($f in $files) {
              $sig = Get-AuthenticodeSignature $f.FullName
              Write-Host "Verifying $($f.Name)..."
              Write-Host "  Signer Subject: $($sig.SignerCertificate.Subject)"
              Write-Host "  Status        : $($sig.Status)"
              
              if ($sig.Status -ne "Valid") {
                  $failures += "$($f.Name) is not valid ($($sig.Status): $($sig.StatusMessage))"
              }
              if ($sig.SignerCertificate.Subject -notmatch "SignPath Foundation") {
                  $failures += "$($f.Name) subject does not match SignPath Foundation"
              }
          }
          if ($failures.Count -gt 0) {
              Write-Error "Signature verification failed: $($failures -join '; ')"
              exit 1
          }
          Write-Host "All SignPath signatures successfully verified!" -ForegroundColor Green

      - name: Compute Signed SHA-256 Hashes
        shell: pwsh
        run: |
          Get-FileHash signed-artifacts\* -Algorithm SHA256 | Tee-Object "signed-artifacts\SHA256SUMS-signed.txt"

      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: "Cyron Uninstaller ${{ github.event.inputs.release_tag }} (SignPath Release Candidate)"
          draft: true
          prerelease: true
          files: |
            signed-artifacts/*.exe
            signed-artifacts/*.msi
            signed-artifacts/SHA256SUMS-signed.txt
          body: |
            ## Cyron Uninstaller Release Candidate

            - **Release Classification:** `SIGNPATH_SIGNED`
            - **Code Signing:** Authenticode signed by SignPath Foundation
            - **Source Commit:** `${{ github.sha }}`
            - **Attribution:** *Free code signing provided by [SignPath.io](https://signpath.org/) via the SignPath Foundation.*
