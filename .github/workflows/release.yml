name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build & Package Windows Release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The landing page is not part of the Vite bundle. Stamp it with this tag
      # before anything is packaged so the version, benchmark rows and download
      # links in the landing folder match the release exactly.
      - name: Stamp landing page with the release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/sync-landing.mjs --tag "$env:RELEASE_TAG"

      - name: Frontend verification & build
        run: |
          npm run landing:check
          npm run typecheck
          npm test
          npm run build

      - name: Upload stamped landing page
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: landing-${{ github.ref_name }}
          path: landing
          retention-days: 30

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Run verification test suites
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml --test security -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml --test cleanup_stress -- --nocapture
          node scripts/verify-cleanup.mjs
          node scripts/verify-e2e.mjs

      - name: Verify updater signing secret
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is not configured. Add the Cyron updater private key as a repository secret before releasing."
          }

      - name: Build Tauri Release Bundles With Updater Artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm run build:release

      - name: Verify Release Bundles & Packaging
        run: |
          node scripts/verify-release-bundles.mjs

      - name: Verify Windows Metadata
        run: |
          npm run verify:metadata

      - name: Generate updater manifest
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -match '^v\d+\.\d+\.\d+') {
            node scripts/generate-updater-manifest.mjs --tag "$env:RELEASE_TAG"
          } else {
            node scripts/generate-updater-manifest.mjs
          }

      - name: Verify updater artifacts
        run: |
          npm run verify:updater

      - name: Generate SHA-256 Checksums
        run: |
          node scripts/generate-checksums.mjs --output src-tauri/target/release/bundle/SHA256SUMS.txt --require-updater

      - name: Publish Release Assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/cyron.exe
            src-tauri/target/release/bundle/latest.json
            src-tauri/target/release/bundle/SHA256SUMS.txt
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: "Cyron Uninstaller ${{ github.ref_name }}"
          make_latest: ${{ !contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          body_path: docs/RELEASE_NOTES_${{ github.ref_name }}.md
          generate_release_notes: true

  deploy-pages:
    name: Deploy Landing Page
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download stamped landing page
        uses: actions/download-artifact@v4
        with:
          name: landing-${{ github.ref_name }}
          path: landing

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: landing

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
