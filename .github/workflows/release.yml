name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build & Package Windows Release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Frontend verification & build
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run verification test suites
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml --test security -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml --test cleanup_stress -- --nocapture
          node scripts/verify-cleanup.mjs
          node scripts/verify-e2e.mjs

      - name: Build Tauri Release Bundles
        run: |
          npm run tauri -- build

      - name: Verify Release Bundles & Packaging
        run: |
          node scripts/verify-release-bundles.mjs

      - name: Verify Windows Metadata
        run: |
          npm run verify:metadata

      - name: Generate SHA-256 Checksums
        shell: pwsh
        run: |
          $bundleDir = "src-tauri/target/release/bundle"
          if (Test-Path $bundleDir) {
              $artifacts = Get-ChildItem -Path $bundleDir -Recurse -Include *.exe,*.msi
              $mainExe = "src-tauri/target/release/cyron.exe"
              $allFiles = @($artifacts)
              if (Test-Path $mainExe) {
                  $allFiles += (Get-Item $mainExe)
              }
              $hashLines = foreach ($item in $allFiles) {
                  $hash = (Get-FileHash -Path $item.FullName -Algorithm SHA256).Hash.ToLower()
                  "$hash  $($item.Name)"
              }
              $hashLines | Out-File -Encoding utf8 -FilePath "$bundleDir/SHA256SUMS.txt"
              Get-Content "$bundleDir/SHA256SUMS.txt"
          }

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/cyron.exe
            src-tauri/target/release/bundle/SHA256SUMS.txt
          draft: false
          prerelease: false
          name: "Cyron Uninstaller ${{ github.ref_name }}"
          generate_release_notes: true
