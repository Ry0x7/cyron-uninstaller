name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build & Package Windows Release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The landing page is not part of the Vite bundle. Stamp it with this tag
      # before anything is packaged so the version, benchmark rows and download
      # links in the landing folder match the release exactly.
      - name: Stamp landing page with the release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/sync-landing.mjs --tag "${{ github.ref_name }}"

      - name: Frontend verification & build
        run: |
          npm run landing:check
          npm run typecheck
          npm test
          npm run build

      - name: Upload stamped landing page
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: landing-${{ github.ref_name }}
          path: landing
          retention-days: 30

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run verification test suites
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml --test security -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml --test cleanup_stress -- --nocapture
          node scripts/verify-cleanup.mjs
          node scripts/verify-e2e.mjs

      - name: Build Tauri Release Bundles
        run: |
          npm run tauri -- build

      - name: Verify Release Bundles & Packaging
        run: |
          node scripts/verify-release-bundles.mjs

      - name: Verify Windows Metadata
        run: |
          npm run verify:metadata

      - name: Generate SHA-256 Checksums
        shell: pwsh
        run: |
          $bundleDir = "src-tauri/target/release/bundle"
          if (Test-Path $bundleDir) {
              $artifacts = Get-ChildItem -Path $bundleDir -Recurse -Include *.exe,*.msi
              $mainExe = "src-tauri/target/release/cyron.exe"
              $allFiles = @($artifacts)
              if (Test-Path $mainExe) {
                  $allFiles += (Get-Item $mainExe)
              }
              # GitHub replaces spaces in uploaded asset names with periods, so the
              # checksum entries must match the names users actually download.
              $hashLines = foreach ($item in $allFiles) {
                  $hash = (Get-FileHash -Path $item.FullName -Algorithm SHA256).Hash.ToLower()
                  $assetName = $item.Name.Replace(' ', '.')
                  "$hash  $assetName"
              }
              # LF endings and no BOM keep `sha256sum -c` working on every platform.
              $sumPath = [System.IO.Path]::GetFullPath("$bundleDir/SHA256SUMS.txt")
              $text = ($hashLines -join "`n") + "`n"
              [System.IO.File]::WriteAllText($sumPath, $text, (New-Object System.Text.UTF8Encoding($false)))
              Get-Content $sumPath
          }

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/cyron.exe
            src-tauri/target/release/bundle/SHA256SUMS.txt
          draft: false
          # Tags with a suffix such as v0.2.0-rc.1 are prereleases; the
          # unsigned/unverified paths documented in the release audit must not
          # be presented as a trusted production release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: "Cyron Uninstaller ${{ github.ref_name }}"
          generate_release_notes: true

  deploy-pages:
    name: Deploy Landing Page
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download stamped landing page
        uses: actions/download-artifact@v4
        with:
          name: landing-${{ github.ref_name }}
          path: landing

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: landing

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
